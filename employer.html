<script>
// ═══════════════════════════════════════════════════════
// EMPLOYER PROFILE PAGE (dedicated full page — PERM + H-1B)
// ═══════════════════════════════════════════════════════
//
// Reads the employer from the URL (?e=<name> or ?e=<slug>) and renders the full
// PERM profile + H-1B salary section as a standalone, deep-linkable page.
// Backend: Cloudflare Worker (immilane-api). Staging host → staging worker.
const EMPLOYER_API_BASE = (typeof window !== 'undefined' && window.IMMILANE_API_BASE)
  ? String(window.IMMILANE_API_BASE).replace(/\/+$/, '')
  : (function () {
      var h = (typeof window !== 'undefined' && window.location && window.location.hostname) || '';
      if (h === 'localhost' || h === '127.0.0.1') return 'http://127.0.0.1:8787';
      if (h === 'immilane.com' || h === 'www.immilane.com') return 'https://immilane-api.younusahamad.workers.dev';
      // Staging (megayounus786.github.io) → staging worker, which serves PERM + H-1B salaries.
      return 'https://immilane-api-staging.younusahamad.workers.dev';
    })();
const EMPLOYER_API_LIMIT = 8;

function esc(s) { var d = document.createElement('div'); d.textContent = s == null ? '' : s; return d.innerHTML; }
function n(v)   { return (v == null || isNaN(v)) ? '—' : Number(v).toLocaleString(); }
const fmtUSD = (v) => (v == null || isNaN(v)) ? '—' : '$' + Math.round(v).toLocaleString('en-US');
const fmtK   = (v) => (v == null || isNaN(v)) ? '—' : '$' + Math.round(v / 1000) + 'k';

function employerSlug(name) {
  if (!name) return '';
  return String(name)
    .toLowerCase()
    .normalize('NFKD')
    .replace(/[̀-ͯ]/g, '')
    .replace(/&/g, ' and ')
    .replace(/[^a-z0-9]+/g, '-')
    .replace(/^-+|-+$/g, '')
    .slice(0, 200);
}

const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const STATUS_COLORS = {
  'CERTIFIED':              '#22c55e',
  'ANALYST REVIEW':         '#f59e0b',
  'DENIED':                 '#ef4444',
  'WITHDRAWN':              '#6b7280',
  'RFI ISSUED':             '#f97316',
  'AUDIT REVIEW':           '#dc2626',
  'PENDING AUDIT RESPONSE': '#b91c1c',
  'CERTIFIED - EXPIRED':    '#15803d',
  'SUPERVISED RECRUITMENT': '#7c3aed'
};
const DEFAULT_COLOR = '#475569';
const PENDING_STATUSES = new Set([
  'ANALYST REVIEW','AUDIT REVIEW','PENDING AUDIT RESPONSE','RFI ISSUED','SUPERVISED RECRUITMENT'
]);

function titleCase(s) {
  return s.toLowerCase().replace(/\b\w/g, c => c.toUpperCase()).replace(/Rfi/g, 'RFI');
}

let globalLastFiling = null;

// ── Data loaders ──────────────────────────────────────────────────────────
function loadMeta() {
  return fetch(EMPLOYER_API_BASE + '/api/meta')
    .then(r => r.ok ? r.json() : Promise.reject(r.status))
    .then(m => { if (m && m.lastFiling) globalLastFiling = m.lastFiling; return m; })
    .catch(() => null);
}

function loadEmployer(slug) {
  return fetch(EMPLOYER_API_BASE + '/api/employers/' + encodeURIComponent(slug))
    .then(r => {
      if (!r.ok) throw new Error('employer fetch failed: ' + r.status);
      return r.json();
    });
}

function loadH1b(slug) {
  return fetch(EMPLOYER_API_BASE + '/api/employers/' + encodeURIComponent(slug) + '/h1b')
    .then(r => {
      if (r.status === 404) return null;
      if (!r.ok) throw new Error('h1b fetch failed: ' + r.status);
      return r.json();
    })
    .catch(() => undefined); // undefined = temporarily unavailable
}

// ── PERM profile renderer (ported verbatim from the former modal) ───────────
function renderEmployerProfile(emp) {
  const statuses = emp.statuses || {};
  const total = emp.total || Object.values(statuses).reduce((s, v) => s + v, 0);

  const fmtDate = (d) => { if (!d) return ''; const p = d.split('-'); return MONTHS[parseInt(p[1], 10) - 1] + ' ' + p[0]; };
  const firstStr = fmtDate(emp.firstFiling);
  const lastStr  = fmtDate(globalLastFiling || emp.lastFiling);
  const filingPeriod = firstStr && lastStr ? (firstStr + ' → ' + lastStr) : (firstStr || lastStr || '—');

  let pendingCount = 0;
  Object.entries(statuses).forEach(([k, v]) => { if (PENDING_STATUSES.has(k)) pendingCount += v; });

  const certCount = statuses['CERTIFIED'] || 0;
  const deniedCount = statuses['DENIED'] || 0;
  const withdrawnCount = statuses['WITHDRAWN'] || 0;
  const adjudicated = certCount + deniedCount;
  const resolved = adjudicated + withdrawnCount;

  let certRateDisplay, certClass;
  if (adjudicated > 0) {
    const cr = certCount / adjudicated * 100;
    certRateDisplay = cr.toFixed(1) + '%';
    certClass = cr > 80 ? 'cr-good' : cr >= 60 ? 'cr-med' : 'cr-bad';
  } else {
    certRateDisplay = '—';
    certClass = 'cr-na';
  }

  const crRows = [];
  if (certCount) crRows.push({ label: 'Certified', val: certCount, color: '#22c55e' });
  if (deniedCount) crRows.push({ label: 'Denied', val: deniedCount, color: '#ef4444' });
  if (withdrawnCount) crRows.push({ label: 'Withdrawn', val: withdrawnCount, color: '#6b7280' });
  const crBreakdownHtml = crRows.map(r =>
    '<div class="stat-detail-row">' +
      '<span class="stat-detail-label" style="color:' + r.color + '">' + r.label + '</span>' +
      '<span class="stat-detail-value">' + n(r.val) + '</span>' +
    '</div>'
  ).join('');

  const donutItems = Object.entries(statuses)
    .map(([k, v]) => ({ label: titleCase(k), value: v, color: STATUS_COLORS[k] || DEFAULT_COLOR }))
    .sort((a, b) => b.value - a.value);
  const donutTotal = donutItems.reduce((s, i) => s + i.value, 0);
  donutItems.forEach(i => { i.pct = donutTotal ? +(i.value / donutTotal * 100).toFixed(1) : 0; });

  const r = 70, circ = 2 * Math.PI * r;
  let off = 0, segs = '';
  donutItems.forEach((item, i) => {
    const len = item.pct / 100 * circ;
    segs += '<circle class="donut-seg" data-i="' + i + '" cx="90" cy="90" r="' + r +
            '" fill="none" stroke="' + item.color + '" stroke-width="30" stroke-dasharray="' +
            len + ' ' + (circ - len) + '" stroke-dashoffset="' + (-off) + '" />';
    off += len;
  });

  const legend = donutItems.map(item =>
    '<div class="legend-item"><div class="legend-dot" style="background:' + item.color +
    ';"></div>' + esc(item.label) +
    '<span class="legend-value">' + n(item.value) + ' (' + item.pct + '%)</span></div>'
  ).join('');

  const titles = (emp.topTitles || []).slice(0, 10);
  const maxTitle = titles.length ? titles[0].count : 1;
  const titlesHtml = titles.map((t, i) =>
    '<div class="employer-row">' +
      '<span class="employer-rank">' + (i + 1) + '</span>' +
      '<span class="employer-name">' + esc(t.title) + '</span>' +
      '<span class="employer-count">' + n(t.count) + '</span>' +
      '<div class="employer-bar"><div class="employer-bar-fill" style="width:' +
        Math.round(t.count / maxTitle * 100) + '%;"></div></div>' +
    '</div>'
  ).join('');

  const body = document.getElementById('emp-body');
  body.innerHTML =
    '<div class="emp-breadcrumb"><a href="./">← Dashboard</a> · Employer Profile</div>' +
    '<h1 class="emp-page-title">' + esc(emp.name) + '</h1>' +
    '<div class="emp-page-subtitle">PERM labor certification &amp; H-1B salary profile · ' + esc(filingPeriod) + '</div>' +
    '<div class="emp-modal-grid">' +
      '<div class="emp-modal-cards">' +
        '<div class="emp-stat-card">' +
          '<div class="emp-stat-label">Total Filings</div>' +
          '<div class="emp-stat-value">' + n(total) + '</div>' +
          '<div class="emp-stat-sub">' + esc(filingPeriod) + '</div>' +
          '<div class="stat-details">' +
            '<div class="stat-detail-row"><span class="stat-detail-label">Pending</span><span class="stat-detail-value">' + n(pendingCount) + '</span></div>' +
            '<div class="stat-detail-row"><span class="stat-detail-label">Resolved</span><span class="stat-detail-value">' + n(resolved) + '</span></div>' +
          '</div>' +
        '</div>' +
        '<div class="emp-stat-card">' +
          '<div class="emp-stat-label">Certification Rate</div>' +
          '<div class="emp-stat-value ' + certClass + '">' + certRateDisplay + '</div>' +
          '<div class="emp-stat-sub">' + (adjudicated > 0 ? n(certCount) + ' certified of ' + n(adjudicated) + ' adjudicated' : 'No cases adjudicated yet') + '</div>' +
          (crRows.length ? '<div class="stat-details">' + crBreakdownHtml + '</div>' : '') +
          '<div class="emp-stat-disclaimer">Based on filings since ' + esc(firstStr || '—') + '</div>' +
        '</div>' +
      '</div>' +
      (donutTotal > 0 ?
      '<div class="emp-modal-section" style="margin-bottom:0;">' +
        '<div class="emp-modal-section-title">Status Distribution <span style="color:#475569;font-weight:400;font-size:11px;">· ' + esc(filingPeriod) + '</span></div>' +
        '<div class="donut-container">' +
          '<div class="donut-wrap">' +
            '<svg class="donut-svg" viewBox="0 0 180 180" id="emp-donut-svg">' + segs + '</svg>' +
            '<div class="donut-center">' +
              '<div class="donut-number" id="emp-donut-num">' + n(donutTotal) + '</div>' +
              '<div class="donut-label" id="emp-donut-lbl">Total Cases</div>' +
              '<div class="donut-pct" id="emp-donut-pct" style="display:none;"></div>' +
            '</div>' +
          '</div>' +
          '<div class="legend">' + legend + '</div>' +
        '</div>' +
      '</div>' : '') +
    '</div>' +
    (titles.length ?
    '<div class="emp-modal-section">' +
      '<div class="emp-modal-section-title">Top ' + Math.min(titles.length, 10) + ' Job Titles</div>' +
      titlesHtml +
    '</div>' : '') +
    '<div class="emp-modal-section" id="emp-h1b-section">' +
      '<div class="emp-modal-section-title">H-1B Salaries ' +
        '<span style="color:#475569;font-weight:400;font-size:11px;">· FY2025 LCA (offered wages)</span></div>' +
      '<div id="emp-h1b-body"><div class="h1b-loading">Loading H-1B salary data…</div></div>' +
    '</div>';

  // Donut hover interactions
  const svg = document.getElementById('emp-donut-svg');
  if (svg) {
    const numEl = document.getElementById('emp-donut-num');
    const lblEl = document.getElementById('emp-donut-lbl');
    const pctEl = document.getElementById('emp-donut-pct');
    const origNum = n(donutTotal);
    svg.querySelectorAll('.donut-seg').forEach(seg => {
      seg.addEventListener('mouseenter', () => {
        const item = donutItems[parseInt(seg.dataset.i, 10)];
        svg.querySelectorAll('.donut-seg').forEach(s => { s.style.opacity = s === seg ? '1' : '0.2'; });
        numEl.textContent = n(item.value);
        numEl.style.color = item.color;
        lblEl.textContent = item.label;
        pctEl.textContent = item.pct + '%';
        pctEl.style.color = item.color;
        pctEl.style.display = '';
      });
      seg.addEventListener('mouseleave', () => {
        svg.querySelectorAll('.donut-seg').forEach(s => { s.style.opacity = '1'; });
        numEl.textContent = origNum;
        numEl.style.color = 'var(--text-primary)';
        lblEl.textContent = 'Total Cases';
        pctEl.style.display = 'none';
      });
    });
  }
}

// ── H-1B salary section renderer (ported verbatim from the former modal) ────
function renderH1bBody(h1b) {
  const body = document.getElementById('emp-h1b-body');
  if (!body) return;

  if (h1b === undefined) {
    body.innerHTML = '<div class="h1b-empty">H-1B salary data is temporarily unavailable.</div>';
    return;
  }
  if (!h1b || !Array.isArray(h1b.socs) || h1b.socs.length === 0) {
    body.innerHTML = '<div class="h1b-empty">No certified <b>H-1B LCA</b> salary data on file for this employer (FY2025).</div>';
    return;
  }

  const socs = h1b.socs.slice().sort((a, b) => (b.n || 0) - (a.n || 0)).slice(0, 10);
  const maxMedian = socs.reduce((m, s) => Math.max(m, s.wage_median || 0), 1);

  let aboveN = 0, cmpN = 0;
  socs.forEach(s => {
    if (s.wage_median != null && s.pw_median != null && s.pw_median > 0) {
      cmpN += (s.n || 0);
      if (s.wage_median >= s.pw_median) aboveN += (s.n || 0);
    }
  });
  const abovePct = cmpN > 0 ? Math.round(aboveN / cmpN * 100) : null;

  const cardsHtml =
    '<div class="emp-modal-cards" style="margin-bottom:14px;">' +
      '<div class="emp-stat-card">' +
        '<div class="emp-stat-label">Median Offered Salary</div>' +
        '<div class="emp-stat-value">' + fmtUSD(h1b.wage_median_all) + '</div>' +
        '<div class="emp-stat-sub">Across ' + n(h1b.total || 0) + ' certified LCAs · ' + esc(h1b.fy || 'FY2025') + '</div>' +
      '</div>' +
      '<div class="emp-stat-card">' +
        '<div class="emp-stat-label">% Above Prevailing</div>' +
        '<div class="emp-stat-value ' + (abovePct == null ? 'cr-na' : abovePct >= 80 ? 'cr-good' : abovePct >= 50 ? 'cr-med' : 'cr-bad') + '">' +
          (abovePct == null ? '—' : abovePct + '%') + '</div>' +
        '<div class="emp-stat-sub">' + (abovePct == null ? 'Prevailing wage not comparable' : 'of filings at/above DOL prevailing wage') + '</div>' +
      '</div>' +
    '</div>';

  const rowsHtml = socs.map((s, i) => {
    const pct = s.pw_median ? Math.round((s.wage_median - s.pw_median) / s.pw_median * 100) : null;
    let pwTag = '';
    if (s.pw_median != null && pct != null) {
      pwTag = '<span class="' + (pct >= 0 ? 'h1b-pw-above' : 'h1b-pw-below') + '">' +
                (pct >= 0 ? '+' + pct + '% above' : pct + '% below') + ' prevailing</span>';
    }
    const range = (s.wage_p10 != null && s.wage_p90 != null)
      ? '<span>P10–P90 ' + fmtK(s.wage_p10) + ' – ' + fmtK(s.wage_p90) + '</span>' : '';
    const pw = (s.pw_median != null) ? '<span>Prevailing ' + fmtUSD(s.pw_median) + '</span>' : '';
    return '<div class="employer-row h1b-row">' +
        '<span class="employer-rank">' + (i + 1) + '</span>' +
        '<span class="employer-name">' + esc(s.title || s.soc || '—') + '</span>' +
        '<span class="employer-count">' + fmtUSD(s.wage_median) + '</span>' +
        '<div class="employer-bar"><div class="employer-bar-fill h1b-bar-fill" style="width:' +
          Math.round((s.wage_median || 0) / maxMedian * 100) + '%;"></div></div>' +
      '</div>' +
      '<div class="h1b-sub">' + range + pw + pwTag + '</div>';
  }).join('');

  body.innerHTML = cardsHtml + rowsHtml;
}

// ── SEO / metadata ──────────────────────────────────────────────────────────
function applySeo(name) {
  const t = name + ' — PERM & H-1B Profile | ImmiLane';
  document.title = t;
  const desc = 'PERM labor certification stats and H-1B salary data for ' + name +
    ': total filings, status distribution, certification rate, top job titles and certified H-1B LCA offered wages (FY2025).';
  const setMeta = (sel, val) => { const el = document.querySelector(sel); if (el) el.setAttribute('content', val); };
  setMeta('meta[name="description"]', desc);
  const ogT = document.getElementById('emp-og-title'); if (ogT) ogT.setAttribute('content', t);
  const ogD = document.getElementById('emp-og-desc'); if (ogD) ogD.setAttribute('content', desc);
  const can = document.getElementById('emp-canonical');
  if (can) {
    // Canonical points at the public (prod) deep link so search engines index one URL per employer.
    can.setAttribute('href', 'https://immilane.com/employer.html?e=' + encodeURIComponent(employerSlug(name)));
  }
}

// ── Page bootstrap ────────────────────────────────────────────────────────
function getEmployerParam() {
  const params = new URLSearchParams(window.location.search);
  // Accept ?e= (name or slug). Fall back to ?employer= / ?slug= for resilience.
  return (params.get('e') || params.get('employer') || params.get('slug') || '').trim();
}

function showError(msg, notFound) {
  const body = document.getElementById('emp-body');
  body.innerHTML =
    '<div class="emp-breadcrumb"><a href="./">← Dashboard</a> · Employer Profile</div>' +
    '<div class="emp-error">' + esc(msg) +
      '<div style="margin-top:14px;"><a href="./">Return to the dashboard</a> to search for an employer.</div>' +
    '</div>';
}

(function initEmployerPage() {
  const raw = getEmployerParam();
  if (!raw) {
    showError('No employer specified.');
    return;
  }
  const slug = employerSlug(raw);
  if (!slug) {
    showError('Invalid employer.');
    return;
  }
  // Provisional title from the URL param while data loads.
  applySeo(raw);

  Promise.all([loadEmployer(slug), loadMeta()])
    .then(([emp]) => {
      if (!emp) { showError('Employer data not found.', true); return; }
      applySeo(emp.name || raw);
      renderEmployerProfile(emp);
      if (typeof gtag === 'function') {
        try { gtag('event', 'employer_profile_view', { employer_name: emp.name }); } catch (e) {}
      }
      // Lazy-load H-1B salaries for the same employer (slug join).
      loadH1b(slug).then(renderH1bBody);
    })
    .catch((err) => {
      if (err && (err.message || '').includes('404')) {
        showError('Employer data not found.', true);
      } else {
        showError('Failed to load employer data. Please try again.');
      }
    });
})();
</script>

<script>
// ═══════════════════════════════════════════════════════
// NAV EMPLOYER SEARCH (typeahead → navigate to employer page)
// ═══════════════════════════════════════════════════════
(function initEmployerSearch() {
  const navSearch   = document.getElementById('nav-search');
  const searchInput = document.getElementById('nav-search-input');
  const clearBtn    = document.getElementById('nav-search-clear');
  const dropdown    = document.getElementById('nav-search-dropdown');
  if (!navSearch || !searchInput || !dropdown) return;

  let activeIdx = -1, lastMatches = [], debounceTimer = null, searchSeq = 0;

  function toggleClearBtn() { if (clearBtn) clearBtn.classList.toggle('visible', searchInput.value.length > 0); }
  if (clearBtn) {
    clearBtn.addEventListener('click', function() {
      searchInput.value = ''; toggleClearBtn(); closeDropdown(); searchInput.focus();
    });
  }

  function closeDropdown() {
    dropdown.classList.remove('open'); dropdown.innerHTML = '';
    activeIdx = -1; lastMatches = [];
  }

  document.addEventListener('click', (e) => {
    if (!navSearch.contains(e.target) && !dropdown.contains(e.target)) closeDropdown();
  });

  searchInput.addEventListener('input', () => {
    toggleClearBtn();
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(runSearch, 200);
  });

  searchInput.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { e.preventDefault(); closeDropdown(); searchInput.blur(); return; }
    if (!lastMatches.length) return;
    if (e.key === 'ArrowDown') { e.preventDefault(); activeIdx = Math.min(activeIdx + 1, lastMatches.length - 1); updateActive(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); activeIdx = Math.max(activeIdx - 1, 0); updateActive(); }
    else if (e.key === 'Enter') {
      e.preventDefault();
      const pick = activeIdx >= 0 ? lastMatches[activeIdx] : lastMatches[0];
      if (pick) selectEmployer(pick.n);
    }
  });

  function updateActive() {
    const items = dropdown.querySelectorAll('.nav-search-item');
    items.forEach((el, i) => {
      el.classList.toggle('active', i === activeIdx);
      if (i === activeIdx) el.scrollIntoView({ block: 'nearest' });
    });
  }

  function runSearch() {
    const q = searchInput.value.trim();
    if (!q) { closeDropdown(); return; }
    const seq = ++searchSeq;
    dropdown.innerHTML = '<div class="nav-search-empty">Searching…</div>';
    dropdown.classList.add('open');
    const url = EMPLOYER_API_BASE + '/api/employers?q=' + encodeURIComponent(q) + '&limit=' + EMPLOYER_API_LIMIT;
    fetch(url)
      .then(r => r.ok ? r.json() : Promise.reject(r.status))
      .then(payload => {
        if (seq !== searchSeq) return;
        const results = (payload && Array.isArray(payload.results)) ? payload.results : [];
        lastMatches = results.map(r => ({ n: r.name, t: r.total }));
        activeIdx = lastMatches.length > 0 ? 0 : -1;
        renderDropdown();
        if (typeof gtag === 'function') {
          try { gtag('event', 'employer_search', { search_term: q, results_count: results.length }); } catch (e) {}
        }
      })
      .catch(() => {
        if (seq !== searchSeq) return;
        lastMatches = []; activeIdx = -1;
        dropdown.innerHTML = '<div class="nav-search-empty">Search unavailable. Try again.</div>';
        dropdown.classList.add('open');
      });
  }

  function renderDropdown() {
    if (!lastMatches.length) {
      dropdown.innerHTML = '<div class="nav-search-empty">No employers found.</div>';
    } else {
      dropdown.innerHTML = lastMatches.map((m, i) =>
        '<div class="nav-search-item' + (i === activeIdx ? ' active' : '') + '" data-idx="' + i + '">' +
          '<span class="nav-search-item-name">' + esc(m.n) + '</span>' +
          '<span class="nav-search-item-count">' + n(m.t) + '</span>' +
        '</div>'
      ).join('');
      dropdown.querySelectorAll('.nav-search-item').forEach((el) => {
        el.addEventListener('mousedown', (ev) => { ev.preventDefault(); });
        el.addEventListener('click', () => {
          const idx = parseInt(el.dataset.idx, 10);
          if (!isNaN(idx) && lastMatches[idx]) selectEmployer(lastMatches[idx].n);
        });
      });
    }
    dropdown.classList.add('open');
  }

  function selectEmployer(name) {
    if (typeof gtag === 'function') {
      try { gtag('event', 'employer_selected', { employer_name: name }); } catch (e) {}
    }
    // Navigate to the dedicated employer page (deep-linkable URL).
    window.location.href = 'employer.html?e=' + encodeURIComponent(name.trim());
  }
})();
</script>
